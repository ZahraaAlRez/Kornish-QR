<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2A1E"/>
      <stop offset="100%" stop-color="#2B1B12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#B8862E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B8862E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9AE5C"/>
      <stop offset="100%" stop-color="#B8862E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- floating bean shapes for depth -->
  <g opacity="0.18">
    <ellipse cx="120" cy="120" rx="22" ry="30" fill="#B8862E" transform="rotate(-15 120 120)"/>
    <ellipse cx="1080" cy="150" rx="18" ry="26" fill="#B8862E" transform="rotate(25 1080 150)"/>
    <ellipse cx="1030" cy="650" rx="24" ry="34" fill="#B8862E" transform="rotate(10 1030 650)"/>
    <ellipse cx="90" cy="680" rx="20" ry="28" fill="#B8862E" transform="rotate(-25 90 680)"/>
  </g>

  <!-- big centered cup illustration -->
  <g transform="translate(600,430)">
    <path d="M-190 -110 C-190 -160, -100 -180, 0 -180 C100 -180, 190 -160, 190 -110
             L165 40 C158 100, 90 150, 0 150 C-90 150, -158 100, -165 40 Z"
          fill="#F3ECDC" stroke="url(#goldA)" stroke-width="6"/>
    <path d="M190 -95 C260 -95, 270 -10, 210 5 L180 5"
          fill="none" stroke="url(#goldA)" stroke-width="12" stroke-linecap="round"/>
    <rect x="-200" y="-140" width="400" height="34" rx="17" fill="url(#goldA)"/>

    <!-- steam -->
    <path d="M-40 -230 C-58 -250, -58 -272, -40 -292 C-22 -312, -22 -334, -40 -354"
          fill="none" stroke="#D9AE5C" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <path d="M10 -240 C-8 -260, -8 -282, 10 -302 C28 -322, 28 -344, 10 -364"
          fill="none" stroke="#D9AE5C" stroke-width="10" stroke-linecap="round"/>
    <path d="M60 -230 C42 -250, 42 -272, 60 -292 C78 -312, 78 -334, 60 -354"
          fill="none" stroke="#D9AE5C" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- name -->
  <text x="600" y="700" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif"
        font-style="italic" font-size="72" fill="#F3ECDC">Cardamom Café</text>
  <text x="600" y="740" text-anchor="middle" font-family="Georgia, serif"
        font-size="20" letter-spacing="8" fill="#B8862E">SCAN · BROWSE · ORDER</text>
</svg>
