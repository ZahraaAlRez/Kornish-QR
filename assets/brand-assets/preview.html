<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preliminary Assets — Cardamom Café</title>
<style>
  body{background:#F3ECDC;font-family:-apple-system,Arial,sans-serif;margin:0;padding:30px 16px 60px;color:#2B1B12;}
  h1{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:26px;text-align:center;margin-bottom:6px;}
  p.sub{text-align:center;color:#4A362A;font-size:13px;margin-top:0;margin-bottom:36px;}
  .row{max-width:960px;margin:0 auto 40px;}
  .label{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8F6720;font-weight:700;margin-bottom:10px;}
  .card{background:#FFFDF7;border-radius:18px;padding:18px;box-shadow:0 10px 24px rgba(43,27,18,0.12);}
  .logo-box{width:180px;margin:0 auto;}
  .main-box img{width:100%;border-radius:14px;display:block;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr);}}
  .grid .card{padding:10px;}
  .grid img{width:100%;border-radius:10px;display:block;}
</style>
</head>
<body>
  <h1>Preliminary Design Assets</h1>
  <p class="sub">Placeholder logo, main picture &amp; category images — swap anytime from the admin panel</p>

  <div class="row">
    <div class="label">Logo</div>
    <div class="card logo-box"><img src="logo.svg" style="width:100%;display:block;"></div>
  </div>

  <div class="row">
    <div class="label">Main Picture (first screen on QR scan)</div>
    <div class="card main-box"><img src="main-pic-placeholder.svg"></div>
  </div>

  <div class="row">
    <div class="label">Category Placeholder Images</div>
    <div class="grid">
      <div class="card"><img src="placeholder-hot-drinks.svg"></div>
      <div class="card"><img src="placeholder-cold-drinks.svg"></div>
      <div class="card"><img src="placeholder-sandwiches.svg"></div>
      <div class="card"><img src="placeholder-desserts.svg"></div>
    </div>
  </div>
</body>
</html>
